<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <!-- ============ 背景 ============ -->
  <rect width="1440" height="1060" fill="#0f172a"/>

  <!-- ============ 标题区 ============ -->
  <text x="720" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#22d3ee">char01 分层架构总图 —— 一个固定"调用壳" + 三种"任务建模"变量（6 篇落位）</text>
  <text x="720" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">核心命题：把大模型当函数用 —— 输入是提示词，输出是文本，中间没有任何框架魔法</text>

  <!-- ============ 用户任务 ============ -->
  <rect x="560" y="96" width="320" height="44" rx="22" fill="#0c4a6e" stroke="#22d3ee" stroke-width="2"/>
  <text x="720" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#7dd3fc">用户任务（摘要 / SQL / 抽取 / 多步）</text>

  <path d="M 720 140 L 720 164" stroke="#475569" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- ============ L1 提示词建模层 ============ -->
  <g>
    <rect x="60" y="170" width="1320" height="160" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="200" font-size="17" font-weight="bold" fill="#34d399">L1 提示词建模层 —— 任务的骨架（核心学习点：把任务"说清楚"）</text>

    <rect x="90" y="218" width="400" height="94" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="106" y="244" font-size="15" font-weight="bold" fill="#e2e8f0">01 三要素模板（起点）</text>
    <text x="106" y="268" font-size="13" fill="#94a3b8">角色 + 任务 + 约束 · 占位符手拼字符串</text>
    <text x="106" y="290" font-size="13" fill="#34d399">实测：最小调用闭环一次跑通</text>

    <rect x="520" y="218" width="400" height="94" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="536" y="244" font-size="15" font-weight="bold" fill="#e2e8f0">02 PromptTemplate 框架化</text>
    <text x="536" y="268" font-size="13" fill="#94a3b8">变量化模板 + LCEL 管道（唯一用 LangChain 的篇）</text>
    <text x="536" y="290" font-size="13" fill="#34d399">实测：template | llm | parser 管道通 —— 从脚本到工程</text>

    <rect x="950" y="218" width="400" height="94" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="966" y="244" font-size="15" font-weight="bold" fill="#e2e8f0">06 上下文注入（Agent 雏形）</text>
    <text x="966" y="268" font-size="13" fill="#94a3b8">对话史注入引导多步行为 —— "下一步"靠上下文引导</text>
    <text x="966" y="290" font-size="13" fill="#fbbf24">两章之桥：引导协议化 = char02 Function Calling</text>
  </g>

  <path d="M 720 330 L 720 354" stroke="#475569" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- ============ L2 输出结构层 ============ -->
  <g>
    <rect x="60" y="360" width="1320" height="150" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="80" y="390" font-size="17" font-weight="bold" fill="#a78bfa">L2 输出结构层 —— 让模型按格式说话（03↔04 是全章最值得精读的对照实验）</text>

    <rect x="90" y="408" width="620" height="84" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="106" y="434" font-size="15" font-weight="bold" fill="#e2e8f0">03 生成类建模 —— 无中生有</text>
    <text x="106" y="458" font-size="13" fill="#94a3b8">要求逐条列出 + 边界约束（"只输出 SQL 不执行"）</text>
    <text x="106" y="480" font-size="13" fill="#fbbf24">主要风险：幻觉（编造不存在的表/字段）→ SQL 通向 char02-06 落地执行</text>

    <rect x="740" y="408" width="610" height="84" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="756" y="434" font-size="15" font-weight="bold" fill="#e2e8f0">04 抽取类建模 —— 原文提取</text>
    <text x="756" y="458" font-size="13" fill="#94a3b8">JSON 样例锚定输出结构 + 字段枚举</text>
    <text x="756" y="480" font-size="13" fill="#fbbf24">主要风险：漏抽、格式跑偏 —— 与 03 同壳不同范式</text>
  </g>

  <!-- L1/L2 汇合到 L3 -->
  <path d="M 720 510 L 720 534" stroke="#475569" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- ============ L3 调用契约层 ============ -->
  <g>
    <rect x="60" y="540" width="1320" height="150" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="570" font-size="17" font-weight="bold" fill="#fbbf24">L3 调用契约层 —— 怎么把话递给模型（05 篇定契约，6 篇共用）</text>

    <rect x="90" y="588" width="400" height="84" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="106" y="614" font-size="15" font-weight="bold" fill="#e2e8f0">system / user 双角色</text>
    <text x="106" y="638" font-size="13" fill="#94a3b8">"你是谁"（system）与"你干什么"（user）分离</text>
    <text x="106" y="660" font-size="13" fill="#34d399">同一角色可复用到千百个任务上</text>

    <rect x="520" y="588" width="400" height="84" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="536" y="614" font-size="15" font-weight="bold" fill="#e2e8f0">temperature 参数语义</text>
    <text x="536" y="638" font-size="13" fill="#94a3b8">调大 = 更随机创意；调小 = 更严谨确定</text>
    <text x="536" y="660" font-size="13" fill="#94a3b8">SQL 偏低 / 抽取极低（事实性任务）</text>

    <rect x="950" y="588" width="400" height="84" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="966" y="614" font-size="15" font-weight="bold" fill="#e2e8f0">max_tokens 参数语义</text>
    <text x="966" y="638" font-size="13" fill="#94a3b8">控制输出长度上限（截断是教学点）</text>
    <text x="966" y="660" font-size="13" fill="#94a3b8">char03-02 实测：截断导致回复不完整</text>
  </g>

  <path d="M 720 690 L 720 714" stroke="#475569" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- ============ L0 模型服务层 ============ -->
  <g>
    <rect x="60" y="720" width="1320" height="140" rx="12" fill="#0c4a6e" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="80" y="750" font-size="17" font-weight="bold" fill="#7dd3fc">L0 模型服务层 —— 永远不变的底座（两种调用姿势，6 篇共用）</text>

    <rect x="90" y="768" width="620" height="76" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="106" y="794" font-size="15" font-weight="bold" fill="#e2e8f0" font-family="Consolas, monospace">姿势 A：dashscope.Generation.call（01 直调）</text>
    <text x="106" y="818" font-size="13" fill="#94a3b8">messages=[{system},{user}] + result_format='message'</text>
    <text x="106" y="836" font-size="12" fill="#94a3b8">原教材依赖本地 GPU / 虚构 qwen-agent API → 统一改写为百炼云端</text>

    <rect x="740" y="768" width="610" height="76" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="756" y="794" font-size="15" font-weight="bold" fill="#e2e8f0" font-family="Consolas, monospace">姿势 B：LangChain ChatTongyi（02 走框架）</text>
    <text x="756" y="818" font-size="13" fill="#94a3b8">PromptTemplate | ChatTongyi | StrOutputParser() LCEL 管道</text>
    <text x="756" y="836" font-size="12" fill="#34d399">实证：模板与管道代码原样保留，只换底层模型 —— 02 篇的架构启示</text>
  </g>

  <!-- ============ 底部读图方法 ============ -->
  <g>
    <rect x="60" y="890" width="1320" height="130" rx="12" fill="#134e4a" stroke="#22d3ee" stroke-width="2"/>
    <text x="720" y="924" text-anchor="middle" font-size="18" font-weight="bold" fill="#22d3ee">读图方法：壳学一遍就够，之后所有工作只是换"建模变量"</text>
    <text x="100" y="956" font-size="14" fill="#d1fae5">固定壳 = L3 契约（05 定）+ L0 底座（01/02 示范两种姿势）→ 三种建模变量 = L1 怎么装任务（01/02/06）+ L2 怎么约束输出（03/04）</text>
    <text x="100" y="984" font-size="14" fill="#d1fae5">80% 的"模型调不动"问题，根源都在提示词建模而不是代码 —— 这是 char01 最重要的架构认知</text>
    <text x="100" y="1008" font-size="12" fill="#94a3b8">三章连读：char01 教"对模型说什么"（内圈）→ char02 教"让模型做什么"（外圈）→ char03 教"模型怎么变成可靠服务"</text>
  </g>

  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
