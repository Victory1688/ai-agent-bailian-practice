<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="Microsoft YaHei, sans-serif">
  <rect width="1280" height="920" fill="#0f172a"/>
  <!-- 标题 -->
  <text x="640" y="44" font-size="26" font-weight="bold" fill="#22d3ee" text-anchor="middle">char10 · A2A vs MCP vs 教材简化对照</text>
  <text x="640" y="68" font-size="13" fill="#94a3b8" text-anchor="middle">理解这张图 = 理解整套 char10 改写的设计理由</text>
  <line x1="60" y1="80" x2="1220" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- 四列：对比维度 + 教材简化 + 真实 A2A v1.0 + 真实 MCP v1.0 -->
  <!-- 表头 -->
  <rect x="40" y="100" width="240" height="50" rx="6" fill="#334155" stroke="#475569"/>
  <text x="160" y="130" font-size="14" font-weight="bold" fill="#cbd5e1" text-anchor="middle">对比维度</text>

  <rect x="300" y="100" width="300" height="50" rx="6" fill="#7f1d1d" stroke="#ef4444"/>
  <text x="450" y="130" font-size="14" font-weight="bold" fill="#fca5a5" text-anchor="middle">教材简化版（虚构）</text>

  <rect x="620" y="100" width="300" height="50" rx="6" fill="#064e3b" stroke="#22d3ee"/>
  <text x="770" y="130" font-size="14" font-weight="bold" fill="#67e8f9" text-anchor="middle">真实 A2A v1.0（Agent↔Agent）</text>

  <rect x="940" y="100" width="300" height="50" rx="6" fill="#1e3a5f" stroke="#60a5fa"/>
  <text x="1090" y="130" font-size="14" font-weight="bold" fill="#93c5fd" text-anchor="middle">真实 MCP v1.0（Agent↔Tool）</text>

  <!-- ===== 行 1: 解决什么 ===== -->
  <rect x="40" y="160" width="240" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="184" font-size="12" font-weight="bold" fill="#e2e8f0">解决什么问题</text>
  <text x="60" y="206" font-size="11" fill="#94a3b8">通信对象是谁</text>

  <rect x="300" y="160" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="188" font-size="12" fill="#fca5a5">没说清楚</text>
  <text x="320" y="208" font-size="11" fill="#94a3b8">Agent 和 Agent ？还是 Agent 和工具？</text>
  <text x="320" y="228" font-size="11" fill="#94a3b8">自定义 A2AMessage/BidMessage/PubSubMessage</text>

  <rect x="620" y="160" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="188" font-size="12" fill="#67e8f9">Agent ↔ Agent</text>
  <text x="640" y="208" font-size="11" fill="#94a3b8">多 Agent 协作：谁干什么、怎么找、怎么协商</text>
  <text x="640" y="228" font-size="11" fill="#94a3b8">消息发送 / Task 订阅 / 协商竞标</text>

  <rect x="940" y="160" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="188" font-size="12" fill="#93c5fd">Agent ↔ Tool/Resource</text>
  <text x="960" y="208" font-size="11" fill="#94a3b8">单个 Agent 调用外部能力</text>
  <text x="960" y="228" font-size="11" fill="#94a3b8">查数据 / 调 API / 读文件</text>

  <!-- ===== 行 2: 核心对象 ===== -->
  <rect x="40" y="240" width="240" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="264" font-size="12" font-weight="bold" fill="#e2e8f0">核心对象</text>
  <text x="60" y="286" font-size="11" fill="#94a3b8">数据模型</text>

  <rect x="300" y="240" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="262" font-size="11" fill="#fca5a5">{id, from/to, intent/type, payload}</text>
  <text x="320" y="280" font-size="11" fill="#94a3b8">自定义字典，无规范约束</text>
  <text x="320" y="300" font-size="11" fill="#94a3b8">Payload 里随便塞什么都行</text>

  <rect x="620" y="240" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="262" font-size="11" fill="#67e8f9">Agent Card / Task / Message / Part / Artifact</text>
  <text x="640" y="280" font-size="11" fill="#94a3b8">Task 七态 / contextId SERVER 生成 / skills 声明</text>
  <text x="640" y="300" font-size="11" fill="#94a3b8">严格 JSON Schema 定义</text>

  <rect x="940" y="240" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="262" font-size="11" fill="#93c5fd">Tool / Resource / Prompt（三原语）</text>
  <text x="960" y="280" font-size="11" fill="#94a3b8">inputSchema(JSON Schema) / uri / template</text>
  <text x="960" y="300" font-size="11" fill="#94a3b8">规范 § Core Concepts</text>

  <!-- ===== 行 3: 协议信封 ===== -->
  <rect x="40" y="320" width="240" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="344" font-size="12" font-weight="bold" fill="#e2e8f0">协议信封</text>
  <text x="60" y="366" font-size="11" fill="#94a3b8">消息长什么样</text>

  <rect x="300" y="320" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="342" font-size="11" fill="#fca5a5">无信封概念</text>
  <text x="320" y="360" font-size="11" fill="#94a3b8">Python 对象直接 to_dict()</text>
  <text x="320" y="380" font-size="11" fill="#94a3b8">没有 id 字段（无法匹配请求-响应）</text>

  <rect x="620" y="320" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="342" font-size="11" fill="#67e8f9">JSON-RPC 2.0（共享！）</text>
  <text x="640" y="360" font-size="11" fill="#94a3b8">Request {id, method, params}</text>
  <text x="640" y="380" font-size="11" fill="#94a3b8">Notification {method, params} 无 id</text>

  <rect x="940" y="320" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="342" font-size="11" fill="#93c5fd">JSON-RPC 2.0（共享！）</text>
  <text x="960" y="360" font-size="11" fill="#94a3b8">tools/list / tools/call / resources/read</text>
  <text x="960" y="380" font-size="11" fill="#94a3b8">prompts/get</text>

  <!-- ===== 行 4: 通信模式 ===== -->
  <rect x="40" y="400" width="240" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="424" font-size="12" font-weight="bold" fill="#e2e8f0">通信模式</text>
  <text x="60" y="446" font-size="11" fill="#94a3b8">Agent 之间怎么发消息</text>

  <rect x="300" y="400" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="422" font-size="11" fill="#fca5a5">单层：for 循环 / topic 匹配</text>
  <text x="320" y="440" font-size="11" fill="#94a3b8">dispatch_task() 里直接 agent.bid_for_task()</text>
  <text x="320" y="460" font-size="11" fill="#94a3b8">SubscriberAgent.on_message() 被直接调</text>

  <rect x="620" y="400" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="422" font-size="11" fill="#67e8f9">两种 + 三层：</text>
  <text x="640" y="440" font-size="11" fill="#94a3b8">Request-Response（一对一）+ Pub/Sub（一对多）</text>
  <text x="640" y="460" font-size="11" fill="#94a3b8">协议层信封 + 业务层 Task + 能力层 LLM</text>

  <rect x="940" y="400" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="422" font-size="11" fill="#93c5fd">单次调用模式</text>
  <text x="960" y="440" font-size="11" fill="#94a3b8">Tool 执行是同步调用-返回</text>
  <text x="960" y="460" font-size="11" fill="#94a3b8">无"订阅"概念，只拉一次</text>

  <!-- ===== 行 5: 认证 ===== -->
  <rect x="40" y="480" width="240" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="504" font-size="12" font-weight="bold" fill="#e2e8f0">认证方式</text>
  <text x="60" y="526" font-size="11" fill="#94a3b8">Agent 怎么证明自己</text>

  <rect x="300" y="480" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="502" font-size="11" fill="#fca5a5">硬编码 token + signature 字段</text>
  <text x="320" y="520" font-size="11" fill="#94a3b8">或干脆没有认证（简化版）</text>
  <text x="320" y="540" font-size="11" fill="#94a3b8">AgentRegistry.check_token() 硬比</text>

  <rect x="620" y="480" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="502" font-size="11" fill="#67e8f9">Agent Card authentication schemes</text>
  <text x="640" y="520" font-size="11" fill="#94a3b8">HTTP Bearer Token / Basic / API Key / OAuth2</text>
  <text x="640" y="540" font-size="11" fill="#94a3b8">verify_auth("Bearer &lt;token&gt;") 解析</text>

  <rect x="940" y="480" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="502" font-size="11" fill="#93c5fd">STDIO：无（环境变量）</text>
  <text x="960" y="520" font-size="11" fill="#94a3b8">HTTP：Authorization 框架（规范 § Auth）</text>
  <text x="960" y="540" font-size="11" fill="#94a3b8">客户端主动向 Server 证明身份</text>

  <!-- ===== 行 6: 能力声明 ===== -->
  <rect x="40" y="560" width="240" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="584" font-size="12" font-weight="bold" fill="#e2e8f0">能力声明</text>
  <text x="60" y="606" font-size="11" fill="#94a3b8">Agent 怎么说自己能干啥</text>

  <rect x="300" y="560" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="582" font-size="11" fill="#fca5a5">capabilities: ["text_summary",...]</text>
  <text x="320" y="600" font-size="11" fill="#94a3b8">纯字符串列表，无描述无 schema</text>
  <text x="320" y="620" font-size="11" fill="#94a3b8">evaluate_score() 用 random.uniform 模拟</text>

  <rect x="620" y="560" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="582" font-size="11" fill="#67e8f9">Agent Card skills[]</text>
  <text x="640" y="600" font-size="11" fill="#94a3b8">{id, description, tags, inputModes, outputModes}</text>
  <text x="640" y="620" font-size="11" fill="#94a3b8">三级匹配：中文描述 → tags → skill_id</text>

  <rect x="940" y="560" width="300" height="80" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="582" font-size="11" fill="#93c5fd">Tool.name + Tool.inputSchema</text>
  <text x="960" y="600" font-size="11" fill="#94a3b8">JSON Schema 精确约束参数类型</text>
  <text x="960" y="620" font-size="11" fill="#94a3b8">tools/list 自动发现</text>

  <!-- ===== 行 7: 传输层 ===== -->
  <rect x="40" y="640" width="240" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="664" font-size="12" font-weight="bold" fill="#e2e8f0">传输方式</text>
  <text x="60" y="686" font-size="11" fill="#94a3b8">消息怎么送过去</text>

  <rect x="300" y="640" width="300" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="662" font-size="11" fill="#fca5a5">函数调用（进程内）</text>
  <text x="320" y="680" font-size="11" fill="#94a3b8">agent.on_message(msg) 直接调</text>

  <rect x="620" y="640" width="300" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="662" font-size="11" fill="#67e8f9">HTTP(SSE) / gRPC / HTTP-REST</text>
  <text x="640" y="680" font-size="11" fill="#94a3b8">规范兼容多传输</text>

  <rect x="940" y="640" width="300" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="662" font-size="11" fill="#93c5fd">STDIO / HTTP(SSE) / Streamable HTTP</text>
  <text x="960" y="680" font-size="11" fill="#94a3b8">SDK 内置传输层</text>

  <!-- ===== 行 8: 最终产出 ===== -->
  <rect x="40" y="710" width="240" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="734" font-size="12" font-weight="bold" fill="#e2e8f0">最终产出</text>
  <text x="60" y="756" font-size="11" fill="#94a3b8">Agent 给什么</text>

  <rect x="300" y="710" width="300" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="732" font-size="11" fill="#fca5a5">payload.answer / proposal 字段</text>
  <text x="320" y="750" font-size="11" fill="#94a3b8">字典里塞个字符串</text>

  <rect x="620" y="710" width="300" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="732" font-size="11" fill="#67e8f9">Task.artifacts[]（Artifact 对象）</text>
  <text x="640" y="750" font-size="11" fill="#94a3b8">parts[{kind, text/file/data}] 多类型</text>

  <rect x="940" y="710" width="300" height="70" fill="#1e293b" stroke="#334155"/>
  <text x="960" y="732" font-size="11" fill="#93c5fd">ToolResult.content[]（[{type, text/image/...}]）</text>
  <text x="960" y="750" font-size="11" fill="#94a3b8">isError 标志</text>

  <!-- 底部关键洞察 -->
  <rect x="40" y="800" width="1200" height="100" rx="8" fill="#134e4a" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="826" font-size="16" font-weight="bold" fill="#22d3ee">关键洞察</text>
  <text x="60" y="850" font-size="12" fill="#e2e8f0">• A2A 和 MCP <tspan fill="#22c55e">共用 JSON-RPC 2.0 信封</tspan>（L2 层），区别在于业务层：A2A 管 Agent↔Agent 协作编排，MCP 管 Agent↔Tool 工具调用</text>
  <text x="60" y="868" font-size="12" fill="#e2e8f0">• 教材的"简化"是 <tspan fill="#fbbf24">把三层混成一层</tspan>——协议层、业务对象层、LLM 能力层全塞在一个函数里。改写的核心就是 <tspan fill="#22d3ee">把它们拆到正确的规范位置上</tspan></text>
  <text x="60" y="886" font-size="12" fill="#e2e8f0">• MCP 不是"prompt 格式"！那是教材对 MCP 的概念性误解。MCP 是 Agent 发现和调用外部工具的 JSON-RPC 协议</text>
</svg>
