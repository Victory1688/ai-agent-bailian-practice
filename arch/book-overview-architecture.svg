  <rect class="c-l3" x="56" y="506" width="880" height="96" rx="10"/>
  <text class="t-head" x="70" y="528" fill="#b42318">L3　能力与工具层 —— 核心：注册表消灭 if/elif；工具永不抛异常</text>
  <rect class="chip" x="70" y="540" width="205" height="50" rx="8" stroke="#f5c6c6"/>
  <text class="t-chip" x="172" y="562" text-anchor="middle" fill="#b42318">工具注册表</text>
  <text class="t-small" x="172" y="580" text-anchor="middle" fill="#c96a6a">ch02 · 声明即注册</text>
  <rect class="chip" x="289" y="540" width="205" height="50" rx="8" stroke="#f5c6c6"/>
  <text class="t-chip" x="391" y="562" text-anchor="middle" fill="#b42318">MCP 工具暴露</text>
  <text class="t-small" x="391" y="580" text-anchor="middle" fill="#c96a6a">ch10 · 本地能力外发</text>
  <rect class="chip" x="508" y="540" width="205" height="50" rx="8" stroke="#f5c6c6"/>
  <text class="t-chip" x="610" y="562" text-anchor="middle" fill="#b42318">检索零件与组件</text>
  <text class="t-small" x="610" y="580" text-anchor="middle" fill="#c96a6a">ch05 · ch06</text>
  <rect class="chip" x="727" y="540" width="195" height="50" rx="8" stroke="#f5c6c6"/>
  <text class="t-chip" x="824" y="562" text-anchor="middle" fill="#b42318">安全求值器</text>
  <text class="t-small" x="824" y="580" text-anchor="middle" fill="#c96a6a">ch13 · 代码执行沙箱</text>

  <line x1="496" y1="602" x2="496" y2="624" stroke="#7a8699" stroke-width="1.4" marker-end="url(#aSolid)"/>
  <text class="t-dot" x="506" y="618">模型调用</text>

  <!-- ============ L2 模型服务层 ============ -->
  <rect class="c-l2" x="56" y="626" width="880" height="96" rx="10"/>
  <text class="t-head" x="70" y="648" fill="#6b3fd4">L2　模型服务层 —— 一平台两扇门：原生 SDK ↔ OpenAI 兼容协议</text>
  <rect class="chip" x="70" y="660" width="205" height="50" rx="8" stroke="#d8cdf7"/>
  <text class="t-chip" x="172" y="682" text-anchor="middle" fill="#6b3fd4">提示词即函数契约</text>
  <text class="t-small" x="172" y="700" text-anchor="middle" fill="#8b6fd0">ch01 · 输入/输出契约</text>
  <rect class="chip" x="289" y="660" width="205" height="50" rx="8" stroke="#d8cdf7"/>
  <text class="t-chip" x="391" y="682" text-anchor="middle" fill="#6b3fd4">模型服务四层</text>
  <text class="t-small" x="391" y="700" text-anchor="middle" fill="#8b6fd0">ch03 · 协议/治理/交付/供给</text>
  <rect class="chip" x="508" y="660" width="205" height="50" rx="8" stroke="#d8cdf7"/>
  <text class="t-chip" x="610" y="682" text-anchor="middle" fill="#6b3fd4">模型适配层</text>
  <text class="t-small" x="610" y="700" text-anchor="middle" fill="#8b6fd0">ch04 · 统一接口</text>
  <rect class="chip" x="727" y="660" width="195" height="50" rx="8" stroke="#d8cdf7"/>
  <text class="t-chip" x="824" y="682" text-anchor="middle" fill="#6b3fd4">模型与协议组件</text>
  <text class="t-small" x="824" y="700" text-anchor="middle" fill="#8b6fd0">ch12 · 双 LLM 后端</text>

  <line x1="496" y1="722" x2="496" y2="744" stroke="#7a8699" stroke-width="1.4" marker-end="url(#aSolid)"/>
