  <text class="t-leg" x="56" y="896">图例：实线箭头 = 相邻层间的同步调用/数据流　·　左侧层号 L1–L6 = 工程抽象层级　·　虚线框 = 纵向贯穿全书的生产化与可验证补丁。</text>
