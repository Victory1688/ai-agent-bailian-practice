  <line x1="972" y1="352" x2="1112" y2="352" stroke="#e0d5f7" stroke-width="1"/>
  <text class="t-chip" x="1042" y="378" text-anchor="middle" fill="#6b3fd4">ch13 收官</text>
  <text class="t-small" x="1042" y="396" text-anchor="middle" fill="#8b6fd0">复合智能体总装</text>
  <text class="t-small" x="1042" y="412" text-anchor="middle" fill="#8b6fd0">测试三部曲</text>
  <text class="t-small" x="1042" y="430" text-anchor="middle" fill="#8b6fd0">→ 给每层打验证补丁</text>
