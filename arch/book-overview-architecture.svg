<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" width="1160" height="900" role="img" aria-label="《AI Agent 开发》全书 13 章分层架构总图">
  <title>《AI Agent 开发：零基础构建复合智能体》全书 13 章分层架构总图</title>
  <defs>
    <marker id="aSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8699"/>
    </marker>
    <marker id="aDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a2b3"/>
    </marker>
    <marker id="aVert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a98fe8"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif; }
    .t-title { font-size: 23px; font-weight: 700; fill: #101828; }
    .t-sub   { font-size: 13.5px; fill: #667085; }
    .t-cap   { font-size: 12px; fill: #98a2b3; }
    .t-head  { font-size: 13.5px; font-weight: 700; }
    .t-chip  { font-size: 12px; }
    .t-small { font-size: 10.5px; }
    .t-dot   { font-size: 11px; fill: #98a2b3; }
    .t-leg   { font-size: 11.5px; fill: #667085; }
    .t-side  { font-size: 11px; fill: #98a2b3; }
    .chip    { fill: #ffffff; stroke-width: 1; }
    .c-l6 { fill: #eff5ff; stroke: #b9cffb; }
    .c-l5 { fill: #fff5e9; stroke: #f0bd85; }
    .c-l4 { fill: #ecfaf3; stroke: #a8e0c6; }
    .c-l3 { fill: #fdeeee; stroke: #f0b4b4; }
    .c-l2 { fill: #f6f1ff; stroke: #c9b6f2; }
    .c-l1 { fill: #f6f7f9; stroke: #d5d9e0; }
  </style>

  <rect x="0" y="0" width="1160" height="900" fill="#ffffff"/>

  <text class="t-title" x="56" y="46">全书 13 章分层架构总图</text>
  <text class="t-sub" x="56" y="72">《AI Agent 开发：零基础构建复合智能体》　·　从"把大模型当函数用"到"把 Agent 做成可上线的系统"</text>
  <text class="t-cap" x="56" y="94">纵向 = 工程抽象层级（越上越贴近业务交付，越下越贴近基础设施）　·　每层右侧标签 = 在该层做出贡献的章节</text>

  <!-- ============ 左侧层号栏 ============ -->
  <text class="t-side" x="30" y="140" text-anchor="middle">交付</text>
  <text class="t-side" x="30" y="152" text-anchor="middle">接入</text>

  <!-- ============ L6 交付与接入层 ============ -->
  <rect class="c-l6" x="56" y="110" width="880" height="96" rx="10"/>
  <text class="t-head" x="70" y="132" fill="#1d4ed8">L6　交付与接入层 —— 对外承诺 HTTP 语义、鉴权、限流、流式返回</text>
  <rect class="chip" x="70" y="144" width="205" height="50" rx="8" stroke="#c9dbfd"/>
  <text class="t-chip" x="172" y="166" text-anchor="middle" fill="#1e40af">Flask Web 服务</text>
  <text class="t-small" x="172" y="184" text-anchor="middle" fill="#5b7fc7">ch11 · 4 个 HTTP 端点</text>
  <rect class="chip" x="289" y="144" width="205" height="50" rx="8" stroke="#c9dbfd"/>
  <text class="t-chip" x="391" y="166" text-anchor="middle" fill="#1e40af">A2A 服务端点</text>
  <text class="t-small" x="391" y="184" text-anchor="middle" fill="#5b7fc7">ch10 · ch11 映射</text>
  <rect class="chip" x="508" y="144" width="205" height="50" rx="8" stroke="#c9dbfd"/>
  <text class="t-chip" x="610" y="166" text-anchor="middle" fill="#1e40af">客户端与网关</text>
  <text class="t-small" x="610" y="184" text-anchor="middle" fill="#5b7fc7">ch12 · 接入防御</text>
  <rect class="chip" x="727" y="144" width="195" height="50" rx="8" stroke="#c9dbfd"/>
  <text class="t-chip" x="824" y="166" text-anchor="middle" fill="#1e40af">流式 / 非流式渲染</text>
  <text class="t-small" x="824" y="184" text-anchor="middle" fill="#5b7fc7">ch11 · ch12</text>

  <line x1="496" y1="206" x2="496" y2="228" stroke="#7a8699" stroke-width="1.4" marker-end="url(#aSolid)"/>
  <text class="t-dot" x="506" y="222">统一请求对象</text>

  <!-- ============ L5 编排与决策层 ============ -->
  <rect class="c-l5" x="56" y="230" width="880" height="132" rx="10" stroke-width="2"/>
  <text class="t-head" x="70" y="252" fill="#b25a08">L5　编排与决策层 —— 核心：决策权在模型，执行权在本地（ReAct 主循环）</text>
  <rect class="chip" x="70" y="264" width="168" height="42" rx="8" stroke="#f5d3ab"/>
  <text class="t-chip" x="154" y="290" text-anchor="middle" fill="#b25a08">agent_chat 单循环</text>
  <rect class="chip" x="250" y="264" width="168" height="42" rx="8" stroke="#f5d3ab"/>
  <text class="t-chip" x="334" y="290" text-anchor="middle" fill="#b25a08">LangChain 声明式链</text>
  <rect class="chip" x="430" y="264" width="168" height="42" rx="8" stroke="#f5d3ab"/>
  <text class="t-chip" x="514" y="290" text-anchor="middle" fill="#b25a08">LangGraph 图编排</text>
  <rect class="chip" x="610" y="264" width="312" height="42" rx="8" stroke="#f5d3ab"/>
  <text class="t-chip" x="766" y="290" text-anchor="middle" fill="#b25a08">多智能体协作与调度（流水线 / 辩论 / 主管）</text>
  <rect class="chip" x="70" y="314" width="256" height="38" rx="8" stroke="#f5d3ab"/>
  <text class="t-chip" x="198" y="338" text-anchor="middle" fill="#b25a08">单智能体五大能力层</text>
  <rect class="chip" x="338" y="314" width="256" height="38" rx="8" stroke="#f5d3ab"/>
  <text class="t-chip" x="466" y="338" text-anchor="middle" fill="#b25a08">A2A 编排组合 · Task 七态</text>
  <rect class="chip" x="606" y="314" width="316" height="38" rx="8" stroke="#f5d3ab"/>
  <text class="t-chip" x="764" y="338" text-anchor="middle" fill="#b25a08">状态机 / 分支 / 循环 / 并行扇出-汇聚</text>

  <line x1="496" y1="362" x2="496" y2="384" stroke="#7a8699" stroke-width="1.4" marker-end="url(#aSolid)"/>
  <text class="t-dot" x="506" y="378">上下文 / 检索请求</text>

  <!-- ============ L4 上下文与记忆层 ============ -->
  <rect class="c-l4" x="56" y="386" width="880" height="96" rx="10"/>
  <text class="t-head" x="70" y="408" fill="#0f7b52">L4　上下文与记忆层 —— 知识注入、上下文路由与池化、记忆分层</text>
  <rect class="chip" x="70" y="420" width="205" height="50" rx="8" stroke="#b6e3cd"/>
  <text class="t-chip" x="172" y="442" text-anchor="middle" fill="#0f7b52">RAG 双链管道</text>
  <text class="t-small" x="172" y="460" text-anchor="middle" fill="#3f9c74">ch06 · 索引链 + 查询链</text>
  <rect class="chip" x="289" y="420" width="205" height="50" rx="8" stroke="#b6e3cd"/>
  <text class="t-chip" x="391" y="442" text-anchor="middle" fill="#0f7b52">上下文工程四层 + 池</text>
  <text class="t-small" x="391" y="460" text-anchor="middle" fill="#3f9c74">ch07 · 表示/路由/存储/合并</text>
  <rect class="chip" x="508" y="420" width="205" height="50" rx="8" stroke="#b6e3cd"/>
  <text class="t-chip" x="610" y="442" text-anchor="middle" fill="#0f7b52">记忆分层</text>
  <text class="t-small" x="610" y="460" text-anchor="middle" fill="#3f9c74">ch08 · 短期/长期/情景/语义</text>
  <rect class="chip" x="727" y="420" width="195" height="50" rx="8" stroke="#b6e3cd"/>
  <text class="t-chip" x="824" y="442" text-anchor="middle" fill="#0f7b52">记忆与知识组件</text>
  <text class="t-small" x="824" y="460" text-anchor="middle" fill="#3f9c74">ch12 · ch13 装配</text>

  <line x1="496" y1="482" x2="496" y2="504" stroke="#7a8699" stroke-width="1.4" marker-end="url(#aSolid)"/>
  <text class="t-dot" x="506" y="498">工具调用 / 能力请求</text>

