  <rect class="c-l1" x="56" y="746" width="880" height="80" rx="10"/>
  <text class="t-head" x="70" y="768" fill="#475467">L1　基础设施与介质层 —— 持久化、传输、观测、测试夹具</text>
  <rect class="chip" x="70" y="778" width="205" height="38" rx="8" stroke="#dcdfe5"/>
  <text class="t-chip" x="172" y="802" text-anchor="middle" fill="#475467">会话持久化（ch02·ch07）</text>
  <rect class="chip" x="289" y="778" width="205" height="38" rx="8" stroke="#dcdfe5"/>
  <text class="t-chip" x="391" y="802" text-anchor="middle" fill="#475467">传输层 HTTP/SSE（ch10·ch11）</text>
  <rect class="chip" x="508" y="778" width="205" height="38" rx="8" stroke="#dcdfe5"/>
  <text class="t-chip" x="610" y="802" text-anchor="middle" fill="#475467">可观测 Tracing（ch12）</text>
  <rect class="chip" x="727" y="778" width="195" height="38" rx="8" stroke="#dcdfe5"/>
  <text class="t-chip" x="824" y="802" text-anchor="middle" fill="#475467">测试夹具（ch13·305 用例）</text>

