<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1090" width="1240" height="1090" role="img" aria-label="chapter12 上线部署七层组件栈详图（含 SpringBoot 微服务平移对照）">
  <title>chapter12 · 上线部署七层组件栈详图 —— 从单脚本 Agent 到生产化 Web 服务（附微服务平移对照）</title>
  <defs>
    <marker id="c12Solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8699"/>
