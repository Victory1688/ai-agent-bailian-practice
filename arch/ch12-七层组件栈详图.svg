      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a2b3"/>
    </marker>
    <marker id="c12Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e57373"/>
    </marker>
  </defs>

  <style>
