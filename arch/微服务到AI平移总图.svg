<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1120" width="1240" height="1120" role="img" aria-label="微服务 Java 到 AI Agent Python 全技术域平移对照总图">
  <title>微服务（Java/SpringBoot）→ AI Agent（Python）全技术域平移对照总图</title>
  <defs>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif; }
    .t-title { font-size: 23px; font-weight: 700; fill: #101828; }
    .t-sub   { font-size: 13.5px; fill: #667085; }
    .t-cap   { font-size: 12px; fill: #98a2b3; }
    .t-colh  { font-size: 14px; font-weight: 700; }
    .t-dom   { font-size: 11.5px; font-weight: 700; }
    .t-jv    { font-size: 10.5px; fill: #475467; }
    .t-py    { font-size: 10.5px; fill: #1e40af; }
    .t-leg   { font-size: 11.5px; fill: #667085; }
    .t-badge { font-size: 10px; font-weight: 700; }
    .chip { fill: #ffffff; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="1240" height="1120" fill="#ffffff"/>

  <text class="t-title" x="48" y="42">微服务（Java/SpringBoot） → AI Agent（Python）全技术域平移对照</text>
  <text class="t-sub" x="48" y="67">20 个技术域逐一对照　·　颜色 = 平移状态：<tspan fill="#16a34a" font-weight="700">🟢 直接平移</tspan>　<tspan fill="#d97706" font-weight="700">🟡 需要重构</tspan>　<tspan fill="#dc2626" font-weight="700">🔴 全新领域</tspan></text>

  <!-- ===== 表头 ===== -->
  <rect x="48" y="86" width="1144" height="34" rx="8" fill="#f2f4f7" stroke="#e4e7ec"/>
  <text class="t-colh" x="72" y="108" fill="#667085">技术域</text>
  <text class="t-colh" x="330" y="108" fill="#b45309">微服务（Java）</text>
  <text class="t-colh" x="700" y="108" fill="#1d4ed8">AI Agent（Python）</text>
  <text class="t-colh" x="1100" y="108" fill="#667085" text-anchor="middle">状态</text>

  <!-- 表体行生成：y 从 128 起，每行 46 -->
  <!-- 1 语言 -->
  <rect class="chip" x="48" y="126" width="1144" height="44" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="153" fill="#101828">1 开发语言</text>
  <text class="t-jv" x="330" y="146">Java 17+｜强静态类型</text>
  <text class="t-jv" x="330" y="162" font-size="9.5" fill="#98a2b3">Maven/Gradle｜Thread+锁</text>
  <text class="t-py" x="700" y="146">Python 3.10+｜动态类型（Pydantic 补校验）</text>
  <text class="t-py" x="700" y="162" font-size="9.5" fill="#5b7fc7">uv/Poetry｜GIL 限制（IO 密集用 Thread）</text>
  <rect x="1070" y="138" width="100" height="20" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text class="t-badge" x="1120" y="152" text-anchor="middle" fill="#dc2626">🔴 换栈</text>

  <!-- 2 Web -->
  <rect class="chip" x="48" y="172" width="1144" height="44" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="199" fill="#101828">2 Web 框架</text>
  <text class="t-jv" x="330" y="199">Spring Boot / WebFlux</text>
  <text class="t-py" x="700" y="199">FastAPI / Flask（ch11 四端点）</text>
  <rect x="1070" y="184" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1120" y="198" text-anchor="middle" fill="#16a34a">🟢 极易</text>

  <!-- 3 DI -->
  <rect class="chip" x="48" y="218" width="1144" height="44" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="245" fill="#101828">3 依赖注入</text>
  <text class="t-jv" x="330" y="245">Spring IoC / @Autowired / @Bean</text>
  <text class="t-py" x="700" y="245">无容器 → 注册表 dict（ch13 五张表）</text>
  <rect x="1070" y="230" width="100" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text class="t-badge" x="1120" y="244" text-anchor="middle" fill="#d97706">🟡 重构</text>

  <!-- 4 配置 -->
  <rect class="chip" x="48" y="264" width="1144" height="44" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="291" fill="#101828">4 配置管理</text>
  <text class="t-jv" x="330" y="291">application.yml + Nacos Config</text>
  <text class="t-py" x="700" y="291">环境变量 + .env / pydantic-settings</text>
  <rect x="1070" y="276" width="100" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text class="t-badge" x="1120" y="290" text-anchor="middle" fill="#d97706">🟡 重构</text>

  <!-- 5 注册发现 -->
  <rect class="chip" x="48" y="310" width="1144" height="44" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="337" fill="#101828">5 服务注册发现</text>
  <text class="t-jv" x="330" y="337">Nacos / Eureka / Consul</text>
  <text class="t-py" x="700" y="337">A2A Agent Card（能力清单，给模型读）ch10</text>
  <rect x="1070" y="322" width="100" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text class="t-badge" x="1120" y="336" text-anchor="middle" fill="#d97706">🟡 重构</text>

  <!-- 6 网关 -->
  <rect class="chip" x="48" y="356" width="1144" height="44" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="383" fill="#101828">6 网关</text>
  <text class="t-jv" x="330" y="383">Spring Cloud Gateway</text>
  <text class="t-py" x="700" y="383">Flask 中间件 + 反向代理（ch12-02）</text>
  <rect x="1070" y="368" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1120" y="382" text-anchor="middle" fill="#16a34a">🟢 极易</text>

  <!-- 7 服务调用 -->
  <rect class="chip" x="48" y="402" width="1144" height="52" rx="8" stroke="#fca5a5" stroke-width="1.6"/>
  <text class="t-dom" x="72" y="432" fill="#b42318">7 服务调用 ★</text>
  <text class="t-jv" x="330" y="424">Feign / RestTemplate / Dubbo</text>
  <text class="t-jv" x="330" y="441" font-size="9.5" fill="#98a2b3">调用链编译期写死</text>
  <text class="t-py" x="700" y="424">Function Calling + MCP（ch02/ch10）</text>
  <text class="t-py" x="700" y="441" font-size="9.5" fill="#c96a6a">调用链运行时由模型决定 ← 控制反转</text>
  <rect x="1070" y="416" width="100" height="20" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text class="t-badge" x="1120" y="430" text-anchor="middle" fill="#dc2626">🟡 反转</text>

  <!-- 8 消息事件 -->
  <rect class="chip" x="48" y="456" width="1144" height="44" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="483" fill="#101828">8 消息 / 事件</text>
  <text class="t-jv" x="330" y="483">Kafka / RocketMQ / RabbitMQ</text>
  <text class="t-py" x="700" y="483">A2A Pub/Sub + SSE / Redis Stream（ch10-05）</text>
  <rect x="1070" y="468" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1120" y="482" text-anchor="middle" fill="#16a34a">🟢 平移</text>

  <!-- 9 缓存 -->
  <rect class="chip" x="48" y="502" width="1144" height="52" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="532" fill="#101828">9 缓存</text>
  <text class="t-jv" x="330" y="524">Redis / Caffeine</text>
  <text class="t-jv" x="330" y="541" font-size="9.5" fill="#98a2b3">KV 精确缓存</text>
  <text class="t-py" x="700" y="524">Redis + 语义向量缓存（相似度>0.95）ch07/ch12</text>
  <text class="t-py" x="700" y="541" font-size="9.5" fill="#5b7fc7">ch12: cache.json 替身 → 可直接换真 Redis</text>
  <rect x="1070" y="516" width="100" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text class="t-badge" x="1120" y="530" text-anchor="middle" fill="#d97706">🟡 重构</text>

  <!-- 10 数据库 -->
  <rect class="chip" x="48" y="556" width="1144" height="52" rx="8" stroke="#fca5a5" stroke-width="1.6"/>
  <text class="t-dom" x="72" y="586" fill="#b42318">10 数据库</text>
  <text class="t-jv" x="330" y="578">MySQL / PostgreSQL / MyBatis</text>
  <text class="t-py" x="700" y="578">同 + 向量库 FAISS/Chroma/Milvus（ch06）</text>
  <text class="t-py" x="700" y="595" font-size="9.5" fill="#c96a6a">新增品类：向量检索（语义 ≠ 精确匹配）</text>
  <rect x="1070" y="570" width="100" height="20" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text class="t-badge" x="1120" y="584" text-anchor="middle" fill="#dc2626">🔴 新增</text>

  <!-- 11 事务 -->
  <rect class="chip" x="48" y="610" width="1144" height="52" rx="8" stroke="#fca5a5" stroke-width="1.6"/>
  <text class="t-dom" x="72" y="640" fill="#b42318">11 事务一致性</text>
  <text class="t-jv" x="330" y="632">@Transactional / Seata / SAGA</text>
  <text class="t-py" x="700" y="632">❌ 无事务 → Task 状态机 + 幂等 + 补偿（ch10/ch13）</text>
  <text class="t-py" x="700" y="649" font-size="9.5" fill="#c96a6a">模型可能重试 → 副作用工具必须显式幂等</text>
  <rect x="1070" y="624" width="100" height="20" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text class="t-badge" x="1120" y="638" text-anchor="middle" fill="#dc2626">🔴 重学</text>

  <!-- 12 限流熔断 -->
  <rect class="chip" x="48" y="664" width="1144" height="52" rx="8" stroke="#bbf7d0" stroke-width="1.6"/>
  <text class="t-dom" x="72" y="694" fill="#15803d">12 限流熔断降级 ★</text>
  <text class="t-jv" x="330" y="686">Sentinel / Hystrix / Resilience4j</text>
  <text class="t-py" x="700" y="686">手写令牌桶 + 熔断器 + 降级链（ch12-05/06）</text>
  <text class="t-py" x="700" y="703" font-size="9.5" fill="#3f9c74">超时/退避/熔断/降级 参数语义 1:1</text>
  <rect x="1070" y="678" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1120" y="692" text-anchor="middle" fill="#16a34a">🟢 1:1</text>

  <!-- 13 可观测 -->
  <rect class="chip" x="48" y="718" width="1144" height="52" rx="8" stroke="#bbf7d0" stroke-width="1.6"/>
  <text class="t-dom" x="72" y="748" fill="#15803d">13 可观测 ★</text>
  <text class="t-jv" x="330" y="740">Micrometer / SkyWalking / Zipkin / ELK</text>
  <text class="t-py" x="700" y="740">OpenTelemetry / Langfuse / LangSmith（ch12-01）</text>
  <text class="t-py" x="700" y="757" font-size="9.5" fill="#c96a6a">新增维度：LLM 调用 trace（prompt/token/成本）</text>
  <rect x="1070" y="732" width="100" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1120" y="746" text-anchor="middle" fill="#16a34a">🟢 复用</text>

  <!-- 14-15 安全 -->
  <rect class="chip" x="48" y="772" width="1144" height="52" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="802" fill="#101828">14-15 安全</text>
  <text class="t-jv" x="330" y="794">Spring Security / JWT / OAuth2</text>
  <text class="t-jv" x="330" y="811" font-size="9.5" fill="#98a2b3">（无内容安全）</text>
  <text class="t-py" x="700" y="794">API Key / Bearer Token（ch12-02）+ 敏感词/幻觉（ch03）</text>
  <text class="t-py" x="700" y="811" font-size="9.5" fill="#c96a6a">⚠ 新增：模型输出是不可信输入，永不执行</text>
  <rect x="1070" y="786" width="46" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1093" y="800" text-anchor="middle" fill="#16a34a">🟢</text>
  <rect x="1122" y="786" width="48" height="20" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text class="t-badge" x="1146" y="800" text-anchor="middle" fill="#dc2626">🔴</text>

  <!-- 16-17 并发调度 -->
  <rect class="chip" x="48" y="826" width="1144" height="52" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="856" fill="#101828">16-17 并发 / 调度</text>
  <text class="t-jv" x="330" y="848">@Async / CompletableFuture / XXL-Job</text>
  <text class="t-py" x="700" y="848">ThreadPool / asyncio + 优先级队列（ch09/ch12）</text>
  <text class="t-py" x="700" y="865" font-size="9.5" fill="#5b7fc7">DAG ≈ 工作流引擎｜ContextScope ≈ ThreadLocal</text>
  <rect x="1070" y="840" width="46" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1093" y="854" text-anchor="middle" fill="#16a34a">🟢</text>
  <rect x="1122" y="840" width="48" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text class="t-badge" x="1146" y="854" text-anchor="middle" fill="#d97706">🟡</text>

  <!-- 18 测试 -->
  <rect class="chip" x="48" y="880" width="1144" height="52" rx="8" stroke="#fca5a5" stroke-width="1.6"/>
  <text class="t-dom" x="72" y="910" fill="#b42318">18 测试</text>
  <text class="t-jv" x="330" y="902">JUnit / Mockito / Testcontainers</text>
  <text class="t-jv" x="330" y="919" font-size="9.5" fill="#98a2b3">断言相等（确定性）</text>
  <text class="t-py" x="700" y="902">pytest / 真实调用 + LLM-as-a-Judge（ch13）</text>
  <text class="t-py" x="700" y="919" font-size="9.5" fill="#c96a6a">断言结构+语义（不确定性）｜305 用例</text>
  <rect x="1070" y="894" width="100" height="20" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text class="t-badge" x="1120" y="908" text-anchor="middle" fill="#dc2626">🔴 范式变</text>

  <!-- 19-20 构建部署/文档 -->
  <rect class="chip" x="48" y="934" width="1144" height="52" rx="8" stroke="#e4e7ec"/>
  <text class="t-dom" x="72" y="964" fill="#101828">19-20 部署 / 文档</text>
  <text class="t-jv" x="330" y="956">Maven/Gradle + Docker + K8s｜Swagger</text>
  <text class="t-py" x="700" y="956">pip/uv/Poetry + Docker + K8s｜OpenAPI/MCP/AgentCard</text>
  <text class="t-py" x="700" y="973" font-size="9.5" fill="#5b7fc7">协议文档从"人读"变"模型读"（自然语言描述）</text>
  <rect x="1070" y="948" width="46" height="20" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text class="t-badge" x="1093" y="962" text-anchor="middle" fill="#d97706">🟡</text>
  <rect x="1122" y="948" width="48" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="t-badge" x="1146" y="962" text-anchor="middle" fill="#16a34a">🟢</text>

  <!-- ===== 全新领域块 ===== -->
  <rect x="48" y="998" width="1144" height="64" rx="10" fill="#fdf2f2" stroke="#fca5a5" stroke-dasharray="6 4"/>
  <text class="t-dom" x="72" y="1022" fill="#b42318">🔴 微服务完全没有的新领域（必须从零学）</text>
  <rect class="chip" x="72" y="1030" width="176" height="24" rx="6" stroke="#fecaca"/>
  <text class="t-py" x="160" y="1047" text-anchor="middle" fill="#b42318">Prompt 工程 ch01</text>
  <rect class="chip" x="256" y="1030" width="176" height="24" rx="6" stroke="#fecaca"/>
  <text class="t-py" x="344" y="1047" text-anchor="middle" fill="#b42318">RAG / 向量检索 ch06</text>
  <rect class="chip" x="440" y="1030" width="176" height="24" rx="6" stroke="#fecaca"/>
  <text class="t-py" x="528" y="1047" text-anchor="middle" fill="#b42318">上下文工程 ch07</text>
  <rect class="chip" x="624" y="1030" width="176" height="24" rx="6" stroke="#fecaca"/>
  <text class="t-py" x="712" y="1047" text-anchor="middle" fill="#b42318">Token 成本模型 ch08/ch12</text>
  <rect class="chip" x="808" y="1030" width="176" height="24" rx="6" stroke="#fecaca"/>
  <text class="t-py" x="896" y="1047" text-anchor="middle" fill="#b42318">幻觉治理 ch03/ch13</text>
  <rect class="chip" x="992" y="1030" width="176" height="24" rx="6" stroke="#fecaca"/>
  <text class="t-py" x="1080" y="1047" text-anchor="middle" fill="#b42318">内容安全审查 ch03-08</text>

  <!-- ===== 底部统计 ===== -->
  <line x1="48" y1="1080" x2="1192" y2="1080" stroke="#d5d9e0" stroke-width="1"/>
  <text class="t-leg" x="48" y="1100">占比：🟢 直接平移 ~60%（基础设施全额可用）　·　🟡 需重构 ~25%（业务编排要重新设计）　·　🔴 全新 ~15%（AI 特有，新大陆）</text>
  <text class="t-leg" x="48" y="1116">记忆锚点：<tspan font-weight="700" fill="#b42318">决策权在模型，执行权在本地。</tspan>　★ 标记 = 全书最需重点理解的域。配套文档：微服务到AI架构平移对照-全技术域版.md</text>
