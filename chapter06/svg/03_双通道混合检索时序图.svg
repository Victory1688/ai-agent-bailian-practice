<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1180" height="900" fill="#0f172a"/>
  <text x="590" y="44" text-anchor="middle" font-size="25" font-weight="bold" fill="#22d3ee">char06 灵魂图之二：双通道混合检索（09 篇——异构数据的融合架构）</text>
  <text x="590" y="72" text-anchor="middle" font-size="13" fill="#94a3b8">非结构化文本走语义检索（FAISS），结构化数据走条件查询（pandas），两路结果融合后交给 LLM 综合推理</text>

  <!-- 用户提问 -->
  <rect x="440" y="100" width="300" height="60" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="590" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">用户提问</text>
  <text x="590" y="149" text-anchor="middle" font-size="13" fill="#cbd5e1">"2020年中国的财政支出是多少？相关政策有没有调整说明？"</text>
  <text x="590" y="178" text-anchor="middle" font-size="12" fill="#94a3b8">一个问题同时命中两类数据需求（数值 + 政策文本）</text>

  <!-- 分叉箭头 -->
  <line x1="500" y1="188" x2="330" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arB)"/>
  <line x1="680" y1="188" x2="850" y2="240" stroke="#34d399" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="380" y="215" text-anchor="middle" font-size="12.5" fill="#38bdf8">语义需求</text>
  <text x="800" y="215" text-anchor="middle" font-size="12.5" fill="#34d399">数值需求</text>

  <!-- ===== 左：文本通道 ===== -->
  <rect x="80" y="250" width="440" height="290" rx="14" fill="#0b1220" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="300" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#38bdf8">通道 A：文本语义检索</text>

  <rect x="105" y="300" width="170" height="58" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="190" y="324" text-anchor="middle" font-size="13" fill="#bae6fd">财政政策文本库</text>
  <text x="190" y="345" text-anchor="middle" font-size="11.5" fill="#94a3b8">6+ 条（网络兜底保真）</text>

  <line x1="275" y1="329" x2="315" y2="329" stroke="#38bdf8" stroke-width="2" marker-end="url(#arB)"/>

  <rect x="320" y="300" width="170" height="58" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="405" y="324" text-anchor="middle" font-size="13" fill="#bae6fd">DashScopeEmbeddings</text>
  <text x="405" y="345" text-anchor="middle" font-size="11.5" fill="#94a3b8">text-embedding-v3</text>

  <line x1="405" y1="358" x2="405" y2="392" stroke="#38bdf8" stroke-width="2" marker-end="url(#arB)"/>

  <rect x="105" y="397" width="385" height="58" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="297" y="421" text-anchor="middle" font-size="13" fill="#bae6fd">FAISS IndexFlatL2 → search(query_vec, k=3)</text>
  <text x="297" y="443" text-anchor="middle" font-size="11.5" fill="#94a3b8">FiscalTextSearchTool（05 篇同款向量操作）</text>

  <rect x="105" y="470" width="385" height="52" rx="8" fill="#020617" stroke="#334155" stroke-width="1.2"/>
  <text x="297" y="492" text-anchor="middle" font-size="12" fill="#f87171">学费：端点硬编码，整库重构后查不到原文</text>
  <text x="297" y="512" text-anchor="middle" font-size="12" fill="#94a3b8">产出：政策文本 top-3（语义相关）</text>

  <!-- ===== 右：数据通道 ===== -->
  <rect x="660" y="250" width="440" height="290" rx="14" fill="#0b1220" stroke="#34d399" stroke-width="2.5"/>
  <text x="880" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#34d399">通道 B：结构化数据查询</text>

  <rect x="685" y="300" width="170" height="58" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="770" y="324" text-anchor="middle" font-size="13" fill="#d1fae5">OWID 财政 CSV</text>
  <text x="770" y="345" text-anchor="middle" font-size="11.5" fill="#94a3b8">requests 下载 + StringIO</text>

  <line x1="855" y1="329" x2="895" y2="329" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>

  <rect x="900" y="300" width="170" height="58" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="985" y="324" text-anchor="middle" font-size="13" fill="#d1fae5">pandas DataFrame</text>
  <text x="985" y="345" text-anchor="middle" font-size="11.5" fill="#94a3b8">China 过滤 + dropna</text>

  <line x1="985" y1="358" x2="985" y2="392" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>

  <rect x="685" y="397" width="385" height="58" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="877" y="421" text-anchor="middle" font-size="13" fill="#d1fae5">硬编码 if/elif 关键词匹配（原样保留）</text>
  <text x="877" y="443" text-anchor="middle" font-size="11.5" fill="#94a3b8">FiscalDataQueryTool：年份+支出/收入 → 定位行取值</text>

  <rect x="685" y="470" width="385" height="52" rx="8" fill="#020617" stroke="#334155" stroke-width="1.2"/>
  <text x="877" y="492" text-anchor="middle" font-size="12" fill="#f87171">辨析："DeepSeek 转 SQL"是假标题——根本没有 LLM</text>
  <text x="877" y="512" text-anchor="middle" font-size="12" fill="#94a3b8">产出：精确数值（"2020年支出占GDP 25.5%"）</text>

  <!-- 汇聚箭头 -->
  <line x1="300" y1="540" x2="500" y2="610" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arB)"/>
  <line x1="880" y1="540" x2="680" y2="610" stroke="#34d399" stroke-width="2.5" marker-end="url(#arG)"/>

  <!-- 融合 prompt -->
  <rect x="340" y="620" width="500" height="130" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="590" y="650" text-anchor="middle" font-size="16" font-weight="bold" fill="#fbbf24">build_prompt 双通道融合</text>
  <text x="590" y="678" text-anchor="middle" font-size="13" fill="#fde68a">【政策解读】= 通道 A 的语义命中（top-3 文本）</text>
  <text x="590" y="702" text-anchor="middle" font-size="13" fill="#fde68a">【财政数据】= 通道 B 的精确数值</text>
  <text x="590" y="728" text-anchor="middle" font-size="12.5" fill="#94a3b8">同构于 char07-02 的多源标注组装思想</text>

  <line x1="590" y1="750" x2="590" y2="785" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arC)"/>

  <!-- LLM -->
  <rect x="440" y="790" width="300" height="70" rx="12" fill="#134e4a" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="590" y="818" text-anchor="middle" font-size="16" font-weight="bold" fill="#6ee7b7">qwen-plus 综合推理</text>
  <text x="590" y="842" text-anchor="middle" font-size="12.5" fill="#d1fae5">实测：数值 + 政策依据一起引用，逻辑自洽</text>

  <!-- 底部结论条 -->
  <rect x="80" y="505" width="0" height="0" fill="none"/>
  <text x="590" y="880" text-anchor="middle" font-size="13.5" fill="#94a3b8">为什么必须双通道：语义检索找"相关"，SQL 式查询给"精确"——只靠向量检索，数字永远是对不上的（LLM 会编）</text>

  <defs>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#34d399"/></marker>
    <marker id="arC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#22d3ee"/></marker>
  </defs>
</svg>
