[pytest]
# ============================================================
# pytest 配置 —— AI Agent 开发：零基础构建复合智能体（阿里百炼改写版）
# ============================================================
#
# 运行全部测试：        pytest
# 只跑某一章：          pytest tests/test_ch13_*.py
# 只跑某个文件：        pytest tests/test_ch13_08_agent_core.py -v
# 只跑某个用例：        pytest tests/test_ch13_08_agent_core.py::test_multiply_tool -v
# 显示 print 输出：      pytest -s
# 只跑标记为 live 的：   pytest -m live
# 跳过真实 API 调用：     pytest -m "not live"

testpaths = tests

# 测试文件命名规则（本项目的测试文件均以 test_chNN_ 开头）
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 中文输出友好 + 详细失败信息
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# 自定义标记
markers =
    live: 需要真实调用 DashScope API 的测试（消耗 token、依赖网络）
    slow: 耗时较长的测试（并发压测、批量评估）
    demo: 教材示例演示性测试

# 超时保护：如已安装 pytest-timeout，取消下面一行注释
# timeout = 300
