<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Microsoft YaHei">
  <rect width="1000" height="740" fill="#0f172a"/>
  <text x="500" y="40" fill="#22d3ee" font-size="24" font-weight="bold" text-anchor="middle">char13 不变式规律 · 贯穿 11 篇的六条横切红线</text>
  <text x="500" y="64" fill="#94a3b8" font-size="13" text-anchor="middle">无论写哪一篇，这六条不变式都必须成立 —— 它们是本章真正的「架构」</text>

  <!-- 卡片 1 -->
  <rect x="40" y="96" width="440" height="180" rx="10" fill="#1e293b" stroke="#22d3ee"/>
  <circle cx="76" cy="130" r="17" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="135" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  <text x="108" y="136" fill="#22d3ee" font-size="15" font-weight="bold">dashscope 统一调用</text>
  <text x="60" y="168" fill="#cbd5e1" font-size="12">Generation.call(model, messages, result_format="message")</text>
  <text x="60" y="188" fill="#94a3b8" font-size="12">全章零 LangChain 中转 · API Key 走环境变量 · tools 参数</text>
  <text x="60" y="206" fill="#94a3b8" font-size="12">必须 {"type":"function","function":{...}} 外层包装</text>
  <text x="60" y="226" fill="#fbbf24" font-size="11">裸 function 列表会被静默忽略（实测教训）</text>
  <text x="60" y="256" fill="#64748b" font-size="11">代表：01/03/05/06/07/08/11</text>

  <!-- 卡片 2 -->
  <rect x="520" y="96" width="440" height="180" rx="10" fill="#1e293b" stroke="#22d3ee"/>
  <circle cx="556" cy="130" r="17" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="556" y="135" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">2</text>
  <text x="588" y="136" fill="#22d3ee" font-size="15" font-weight="bold">LLM 输出永不执行（安全红线）</text>
  <text x="540" y="168" fill="#cbd5e1" font-size="12">凡消费 LLM 结构化输出：三步清洗（剥围栏 → 括号定位</text>
  <text x="540" y="186" fill="#cbd5e1" font-size="12">→ 严格 json.loads），杜绝 eval 与 str.format 花括号坑</text>
  <text x="540" y="206" fill="#94a3b8" font-size="12">计算类输出走 AST 白名单 safe_eval，白名单外一律拒绝</text>
  <text x="540" y="226" fill="#fbbf24" font-size="11">LLM 输出永远是数据，永远不是代码</text>
  <text x="540" y="256" fill="#64748b" font-size="11">代表：02 / 03 / 11</text>

  <!-- 卡片 3 -->
  <rect x="40" y="296" width="440" height="180" rx="10" fill="#1e293b" stroke="#22d3ee"/>
  <circle cx="76" cy="330" r="17" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="335" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">3</text>
  <text x="108" y="336" fill="#22d3ee" font-size="15" font-weight="bold">错误与状态都是数据（结构化契约）</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">双层失败语义：工具级失败 → 错误文本回填给模型（链路</text>
  <text x="60" y="386" fill="#cbd5e1" font-size="12">不断）；模型级失败 → 主备回退（调用层真实生效）</text>
  <text x="60" y="406" fill="#94a3b8" font-size="12">布尔 success · None≠False · raise...from 保留异常链</text>
  <text x="60" y="426" fill="#fbbf24" font-size="11">「[ERROR]」字符串混流与字符串判错一律出局</text>
  <text x="60" y="456" fill="#64748b" font-size="11">代表：03/04/08/09/10/11</text>

  <!-- 卡片 4 -->
  <rect x="520" y="296" width="440" height="180" rx="10" fill="#1e293b" stroke="#22d3ee"/>
  <circle cx="556" cy="330" r="17" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="556" y="335" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">4</text>
  <text x="588" y="336" fill="#22d3ee" font-size="15" font-weight="bold">注册表消灭 if/elif 平行映射</text>
  <text x="540" y="368" fill="#cbd5e1" font-size="12">MODEL_REGISTRY（主备槽位）· TOOL_IMPLS（工具注册）</text>
  <text x="540" y="386" fill="#cbd5e1" font-size="12">TASK_REGISTRY（任务）· INTENT_ROUTES（意图路由）</text>
  <text x="540" y="404" fill="#cbd5e1" font-size="12">STATUS_TRANSITIONS（状态机白名单）</text>
  <text x="540" y="424" fill="#94a3b8" font-size="12">新增能力 = 注册一行，不改控制流；if/elif 顺序陷阱根除</text>
  <text x="540" y="456" fill="#64748b" font-size="11">代表：01/02/03/04/06/08</text>

  <!-- 卡片 5 -->
  <rect x="40" y="496" width="440" height="180" rx="10" fill="#1e293b" stroke="#22d3ee"/>
  <circle cx="76" cy="530" r="17" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="535" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">5</text>
  <text x="108" y="536" fill="#22d3ee" font-size="15" font-weight="bold">可观测性内建（不是事后补丁）</text>
  <text x="60" y="568" fill="#cbd5e1" font-size="12">run 返回 {"success", "reply", "steps"}：steps 记录每轮</text>
  <text x="60" y="586" fill="#cbd5e1" font-size="12">工具调用（name/args/result 截断）· attempted_slots 回退</text>
  <text x="60" y="604" fill="#cbd5e1" font-size="12">留痕 · metrics 结构化（错误率/P50/P95/幻觉率）</text>
  <text x="60" y="624" fill="#fbbf24" font-size="11">verbose=True 布尔开关与 traceback print 外泄出局</text>
  <text x="60" y="654" fill="#64748b" font-size="11">代表：08/09/10/11</text>

  <!-- 卡片 6 -->
  <rect x="520" y="496" width="440" height="180" rx="10" fill="#1e293b" stroke="#22d3ee"/>
  <circle cx="556" cy="530" r="17" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="556" y="535" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">6</text>
  <text x="588" y="536" fill="#22d3ee" font-size="15" font-weight="bold">self-test 分层验证（篇篇必备）</text>
  <text x="540" y="568" fill="#cbd5e1" font-size="12">确定性单测（纯函数手工验算）+ 真实链路冒烟 + LLM</text>
  <text x="540" y="586" fill="#cbd5e1" font-size="12">非确定行为分路径验契约（调工具/直答均合理）</text>
  <text x="540" y="606" fill="#94a3b8" font-size="12">多轮语义用集合/分对断言；外设扰动用 try/finally 还原</text>
  <text x="540" y="626" fill="#fbbf24" font-size="11">全章 11 篇 × 5 项 self-test 全部实测通过</text>
  <text x="540" y="654" fill="#64748b" font-size="11">代表：全部 11 篇</text>

  <!-- 底注 -->
  <text x="500" y="710" fill="#64748b" font-size="12" text-anchor="middle">新人自查清单：改任何一篇前，先确认这六条不变式是否仍然成立 —— 它们比任何单个功能都重要</text>
</svg>
