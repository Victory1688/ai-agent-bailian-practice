<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="Microsoft YaHei">
  <rect width="1000" height="780" fill="#0f172a"/>
  <text x="500" y="40" fill="#22d3ee" font-size="24" font-weight="bold" text-anchor="middle">char13 复合智能体系统 · 分层总架构</text>
  <text x="500" y="64" fill="#94a3b8" font-size="13" text-anchor="middle">从零构建（01-08 实现层）× 三步质量闭环（09-11 测试层）｜ dashscope 统一模型网关</text>

  <!-- 用户输入 -->
  <rect x="400" y="84" width="200" height="30" rx="15" fill="#164e63" stroke="#22d3ee"/>
  <text x="500" y="104" fill="#e2e8f0" font-size="13" text-anchor="middle">用户请求（自然语言）</text>
  <line x1="500" y1="114" x2="500" y2="132" stroke="#22d3ee" marker-end="url(#arr)"/>

  <!-- 左侧纵条：01 接口层地基（贯穿全层） -->
  <rect x="16" y="140" width="120" height="440" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="76" y="168" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">01 接口地基</text>
  <text x="76" y="196" fill="#cbd5e1" font-size="11" text-anchor="middle">Message 构造时</text>
  <text x="76" y="212" fill="#cbd5e1" font-size="11" text-anchor="middle">role 白名单校验</text>
  <text x="76" y="238" fill="#cbd5e1" font-size="11" text-anchor="middle">Conversation</text>
  <text x="76" y="254" fill="#cbd5e1" font-size="11" text-anchor="middle">Context 会话容器</text>
  <text x="76" y="280" fill="#cbd5e1" font-size="11" text-anchor="middle">ModelAdapter</text>
  <text x="76" y="296" fill="#cbd5e1" font-size="11" text-anchor="middle">适配器注册表</text>
  <text x="76" y="312" fill="#cbd5e1" font-size="11" text-anchor="middle">+ 池化复用</text>
  <text x="76" y="338" fill="#64748b" font-size="11" text-anchor="middle">（被 02-11</text>
  <text x="76" y="354" fill="#64748b" font-size="11" text-anchor="middle">全部复用）</text>

  <!-- 入口层 -->
  <rect x="160" y="140" width="810" height="52" rx="8" fill="#1e293b" stroke="#22d3ee"/>
  <text x="175" y="160" fill="#22d3ee" font-size="13" font-weight="bold">入口层 · 02 意图识别与入口解析</text>
  <text x="175" y="180" fill="#94a3b8" font-size="12">三步安全清洗（剥围栏/括号定位/严格JSON）· 意图白名单 · 兜底链 —— LLM 输出永不执行</text>
  <line x1="500" y1="192" x2="500" y2="212" stroke="#22d3ee" marker-end="url(#arr)"/>

  <!-- 主控层 -->
  <rect x="160" y="216" width="810" height="76" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="175" y="238" fill="#22d3ee" font-size="13" font-weight="bold">主控层 · 08 AgentCore 通用 Agent 主控链条（大脑）</text>
  <rect x="185" y="248" width="240" height="34" rx="5" fill="#0f172a" stroke="#475569"/>
  <text x="305" y="270" fill="#e2e8f0" font-size="12" text-anchor="middle">function calling 工具循环（≤5轮）</text>
  <rect x="440" y="248" width="240" height="34" rx="5" fill="#0f172a" stroke="#475569"/>
  <text x="560" y="270" fill="#e2e8f0" font-size="12" text-anchor="middle">主备回退（内嵌调用层）</text>
  <rect x="695" y="248" width="250" height="34" rx="5" fill="#0f172a" stroke="#475569"/>
  <text x="820" y="270" fill="#e2e8f0" font-size="12" text-anchor="middle">多轮记忆 + steps 轨迹留痕</text>

  <!-- 分发箭头 -->
  <line x1="330" y1="292" x2="290" y2="322" stroke="#22d3ee" marker-end="url(#arr)"/>
  <line x1="565" y1="292" x2="565" y2="322" stroke="#22d3ee" marker-end="url(#arr)"/>
  <line x1="800" y1="292" x2="840" y2="322" stroke="#22d3ee" marker-end="url(#arr)"/>

  <!-- 能力层 -->
  <text x="76" y="345" fill="#22d3ee" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(0)">能力层</text>
  <rect x="160" y="326" width="258" height="72" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="175" y="346" fill="#e2e8f0" font-size="12" font-weight="bold">03 工具调用链（双手）</text>
  <text x="175" y="364" fill="#94a3b8" font-size="11">dashscope 原生 function calling</text>
  <text x="175" y="380" fill="#94a3b8" font-size="11">safe_eval AST 白名单 · 错误回填</text>
  <rect x="436" y="326" width="258" height="72" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="451" y="346" fill="#e2e8f0" font-size="12" font-weight="bold">04 子状态管理与调度（秩序）</text>
  <text x="451" y="364" fill="#94a3b8" font-size="11">STATUS_TRANSITIONS 状态机白名单</text>
  <text x="451" y="380" fill="#94a3b8" font-size="11">TASK_REGISTRY 单一注册表 · 快照</text>
  <rect x="712" y="326" width="258" height="72" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="727" y="346" fill="#e2e8f0" font-size="12" font-weight="bold">05 RAG 检索问答（知识）</text>
  <text x="727" y="364" fill="#94a3b8" font-size="11">text-embedding-v3 向量化</text>
  <text x="727" y="380" fill="#94a3b8" font-size="11">cache.json 缓存 · 余弦检索流水线</text>

  <!-- 协议层 -->
  <text x="76" y="455" fill="#22d3ee" font-size="13" font-weight="bold" text-anchor="middle">协议层</text>
  <rect x="160" y="418" width="395" height="72" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="175" y="438" fill="#e2e8f0" font-size="12" font-weight="bold">06 MCP 上下文路由器（工具总线）</text>
  <text x="175" y="456" fill="#94a3b8" font-size="11">JSON-RPC 2.0 信封 · initialize 握手 · tools 原语</text>
  <text x="175" y="472" fill="#fbbf24" font-size="11">按真实 MCP 规范（2025-06-18）重构</text>
  <rect x="575" y="418" width="395" height="72" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="590" y="438" fill="#e2e8f0" font-size="12" font-weight="bold">07 A2A 消息协议模块注入（跨 Agent 标准）</text>
  <text x="590" y="456" fill="#94a3b8" font-size="11">AgentCard 自描述 · message/send · Task 生命周期</text>
  <text x="590" y="472" fill="#fbbf24" font-size="11">按真实 A2A 规范（Google 2025）重构</text>

  <!-- 模型层 -->
  <text x="76" y="545" fill="#22d3ee" font-size="13" font-weight="bold" text-anchor="middle">模型层</text>
  <rect x="160" y="510" width="810" height="70" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="175" y="532" fill="#fbbf24" font-size="13" font-weight="bold">dashscope 统一模型网关（01 ModelAdapter 适配器注册表屏蔽协议差异）</text>
  <rect x="200" y="542" width="220" height="30" rx="5" fill="#0f172a" stroke="#475569"/>
  <text x="310" y="562" fill="#e2e8f0" font-size="12" text-anchor="middle">qwen-plus（primary 主）</text>
  <rect x="450" y="542" width="220" height="30" rx="5" fill="#0f172a" stroke="#475569"/>
  <text x="560" y="562" fill="#e2e8f0" font-size="12" text-anchor="middle">qwen-turbo（backup 备）</text>
  <rect x="700" y="542" width="240" height="30" rx="5" fill="#0f172a" stroke="#475569"/>
  <text x="820" y="562" fill="#e2e8f0" font-size="12" text-anchor="middle">OpenAI 兼容协议（跨模型）</text>
  <line x1="565" y1="494" x2="565" y2="510" stroke="#22d3ee" marker-end="url(#arr)"/>

  <!-- 测试层横切 -->
  <rect x="160" y="604" width="810" height="70" rx="8" fill="#312e81" stroke="#818cf8" stroke-dasharray="6 3"/>
  <text x="175" y="626" fill="#818cf8" font-size="13" font-weight="bold">测试层 · 三步质量闭环（横切全部实现层）</text>
  <rect x="185" y="636" width="240" height="30" rx="5" fill="#0f172a" stroke="#818cf8"/>
  <text x="305" y="656" fill="#e2e8f0" font-size="12" text-anchor="middle">09 工具正确率（steps 契约）</text>
  <rect x="440" y="636" width="240" height="30" rx="5" fill="#0f172a" stroke="#818cf8"/>
  <text x="560" y="656" fill="#e2e8f0" font-size="12" text-anchor="middle">10 并发压测（P95/串话）</text>
  <rect x="695" y="636" width="250" height="30" rx="5" fill="#0f172a" stroke="#818cf8"/>
  <text x="820" y="656" fill="#e2e8f0" font-size="12" text-anchor="middle">11 幻觉率（LLM-as-a-Judge）</text>
  <line x1="500" y1="584" x2="500" y2="604" stroke="#818cf8" stroke-dasharray="5 3" marker-end="url(#arr2)"/>

  <!-- 底注 -->
  <text x="500" y="712" fill="#64748b" font-size="12" text-anchor="middle">实线 = 主请求链路（入口 → 主控 → 能力/协议 → 模型网关） ｜ 虚线 = 质量观测横切</text>
  <text x="500" y="734" fill="#475569" font-size="11" text-anchor="middle">11 篇示例 = 1 个可运行的复合智能体系统：功能正确（02-08）→ 能力可信（09）→ 负载可靠（10）→ 内容可信（11）</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#818cf8"/>
    </marker>
  </defs>
</svg>
