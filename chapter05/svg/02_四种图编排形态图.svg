<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1180" height="760" fill="#0f172a"/>
  <text x="590" y="46" text-anchor="middle" font-size="25" font-weight="bold" fill="#22d3ee">char05 四种图编排形态：LangGraph 的全部拓扑语言</text>
  <text x="590" y="74" text-anchor="middle" font-size="13" fill="#94a3b8">四种形状对应四个文件，组合起来可以拼出任意业务流程——生产级工作流引擎的拓扑词汇表</text>

  <!-- ===== 形态一：顺序图 ===== -->
  <rect x="45" y="110" width="255" height="270" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="172" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#38bdf8">顺序图（01 篇）</text>
  <text x="172" y="163" text-anchor="middle" font-size="12" fill="#94a3b8">add_edge(A, B) 固定流向</text>

  <!-- mini 拓扑 -->
  <circle cx="110" cy="215" r="22" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <text x="110" y="220" text-anchor="middle" font-size="12" fill="#7dd3fc">A</text>
  <circle cx="235" cy="215" r="22" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <text x="235" y="220" text-anchor="middle" font-size="12" fill="#7dd3fc">B</text>
  <line x1="133" y1="215" x2="208" y2="215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arB)"/>

  <text x="172" y="268" text-anchor="middle" font-size="12" fill="#94a3b8">entry_point 指定入口</text>
  <text x="172" y="290" text-anchor="middle" font-size="12" fill="#94a3b8">A 返回增量 → B 接续</text>
  <rect x="65" y="310" width="215" height="52" rx="6" fill="#020617" stroke="#334155" stroke-width="1.2"/>
  <text x="172" y="332" text-anchor="middle" font-size="11.5" fill="#f87171">学费：State 裸 dict 无注解</text>
  <text x="172" y="352" text-anchor="middle" font-size="11.5" fill="#f87171">→ invoke 返回 None（静默失败）</text>

  <!-- ===== 形态二：条件边 ===== -->
  <rect x="315" y="110" width="255" height="270" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="442" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#a78bfa">条件边（02 篇）</text>
  <text x="442" y="163" text-anchor="middle" font-size="12" fill="#94a3b8">add_conditional_edges 路由</text>

  <!-- mini 拓扑 -->
  <circle cx="382" cy="215" r="22" fill="#020617" stroke="#a78bfa" stroke-width="2"/>
  <text x="382" y="220" text-anchor="middle" font-size="12" fill="#c4b5fd">A</text>
  <circle cx="545" cy="185" r="20" fill="#020617" stroke="#a78bfa" stroke-width="2"/>
  <text x="545" y="190" text-anchor="middle" font-size="11" fill="#c4b5fd">B</text>
  <circle cx="545" cy="248" r="20" fill="#020617" stroke="#a78bfa" stroke-width="2"/>
  <text x="545" y="253" text-anchor="middle" font-size="11" fill="#c4b5fd">C</text>
  <line x1="404" y1="207" x2="520" y2="189" stroke="#a78bfa" stroke-width="2" marker-end="url(#arA)"/>
  <line x1="404" y1="224" x2="520" y2="245" stroke="#a78bfa" stroke-width="2" marker-end="url(#arA)"/>
  <text x="455" y="230" text-anchor="middle" font-size="11" fill="#a78bfa">router(x)</text>

  <text x="442" y="290" text-anchor="middle" font-size="12" fill="#94a3b8">路由函数返回键名 → 映射表查边</text>
  <text x="442" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">决策逻辑从代码搬到图声明</text>
  <rect x="335" y="330" width="215" height="40" rx="6" fill="#020617" stroke="#334155" stroke-width="1.2"/>
  <text x="442" y="355" text-anchor="middle" font-size="11.5" fill="#86efac">char02 while True 的图化前身</text>

  <!-- ===== 形态三：并行图 ===== -->
  <rect x="585" y="110" width="255" height="270" rx="12" fill="#134e4a" stroke="#34d399" stroke-width="2.5"/>
  <text x="712" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#34d399">并行图（10 篇）</text>
  <text x="712" y="163" text-anchor="middle" font-size="12" fill="#94a3b8">扇出-汇聚 + superstep 屏障</text>

  <!-- mini 拓扑 -->
  <circle cx="650" cy="215" r="20" fill="#020617" stroke="#34d399" stroke-width="2"/>
  <text x="650" y="220" text-anchor="middle" font-size="11" fill="#86efac">A</text>
  <circle cx="772" cy="178" r="18" fill="#020617" stroke="#34d399" stroke-width="2"/>
  <text x="772" y="183" text-anchor="middle" font-size="10.5" fill="#86efac">B</text>
  <circle cx="772" cy="252" r="18" fill="#020617" stroke="#34d399" stroke-width="2"/>
  <text x="772" y="257" text-anchor="middle" font-size="10.5" fill="#86efac">C</text>
  <line x1="670" y1="207" x2="750" y2="182" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>
  <line x1="670" y1="223" x2="750" y2="248" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>
  <line x1="700" y1="185" x2="710" y2="195" stroke="none"/>

  <text x="712" y="290" text-anchor="middle" font-size="12" fill="#94a3b8">A 两条出边 = 同 superstep 并行</text>
  <text x="712" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">屏障语义：B/C 全完成才放行 D</text>
  <rect x="605" y="330" width="215" height="40" rx="6" fill="#020617" stroke="#334155" stroke-width="1.2"/>
  <text x="712" y="355" text-anchor="middle" font-size="11.5" fill="#f87171">随机分工：B=[子任务2] C=[子任务1,2]</text>

  <!-- ===== 形态四：循环图 ===== -->
  <rect x="855" y="110" width="255" height="270" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="982" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#fbbf24">循环图（回边）</text>
  <text x="982" y="163" text-anchor="middle" font-size="12" fill="#94a3b8">边指回上游节点</text>

  <!-- mini 拓扑 -->
  <circle cx="940" cy="215" r="20" fill="#020617" stroke="#fbbf24" stroke-width="2"/>
  <text x="940" y="220" text-anchor="middle" font-size="11" fill="#fde68a">A</text>
  <circle cx="1040" cy="215" r="20" fill="#020617" stroke="#fbbf24" stroke-width="2"/>
  <text x="1040" y="220" text-anchor="middle" font-size="11" fill="#fde68a">B</text>
  <line x1="960" y1="215" x2="1016" y2="215" stroke="#fbbf24" stroke-width="2" marker-end="url(#arY)"/>
  <path d="M 1040 193 C 1040 158 940 158 940 191" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arY)"/>
  <text x="990" y="172" text-anchor="middle" font-size="10.5" fill="#fbbf24">回边（条件触发）</text>

  <text x="982" y="290" text-anchor="middle" font-size="12" fill="#94a3b8">条件边 + 回边 = Agent 循环</text>
  <text x="982" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">直到路由函数说"结束"为止</text>
  <rect x="875" y="330" width="215" height="40" rx="6" fill="#020617" stroke="#334155" stroke-width="1.2"/>
  <text x="982" y="355" text-anchor="middle" font-size="11.5" fill="#94a3b8">ReAct 循环的图化表达</text>

  <!-- 中部对照：三种决策机制 -->
  <rect x="45" y="405" width="1065" height="150" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#22d3ee">同一家族的"决策"对照：本篇条件边 vs char06 function calling vs char07 关键词路由</text>

  <text x="230" y="468" text-anchor="middle" font-size="12.5" fill="#a78bfa" font-weight="bold">LangGraph 条件边（02）</text>
  <text x="230" y="490" text-anchor="middle" font-size="11.5" fill="#e2e8f0">路由函数读 State 返回键名</text>
  <text x="230" y="510" text-anchor="middle" font-size="11.5" fill="#e2e8f0">拓扑级决策，静态可见</text>

  <text x="590" y="468" text-anchor="middle" font-size="12.5" fill="#34d399" font-weight="bold">LLM function calling（char06）</text>
  <text x="590" y="490" text-anchor="middle" font-size="11.5" fill="#e2e8f0">模型决定调哪个工具</text>
  <text x="590" y="510" text-anchor="middle" font-size="11.5" fill="#e2e8f0">模型级决策，动态灵活</text>

  <text x="950" y="468" text-anchor="middle" font-size="12.5" fill="#fbbf24" font-weight="bold">关键词路由（char03/07）</text>
  <text x="950" y="490" text-anchor="middle" font-size="11.5" fill="#e2e8f0">if/elif 硬编码匹配</text>
  <text x="950" y="510" text-anchor="middle" font-size="11.5" fill="#e2e8f0">规则级决策，最快但最脆</text>

  <text x="590" y="538" text-anchor="middle" font-size="12" fill="#64748b">生产组合拳：关键词粗筛 → LLM 精判 → 图条件边执行转向——三层决策各司其职</text>

  <!-- 底部：superstep 执行引擎 -->
  <rect x="45" y="580" width="1065" height="150" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="590" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">底层引擎：superstep 执行模型（所有形态共享）</text>
  <text x="590" y="638" text-anchor="middle" font-size="13" fill="#94a3b8">每一步 = 取出当前可执行节点集合 → 执行（并行则并发）→ 收集增量 → 合并 State → 进入下一步</text>
  <text x="590" y="664" text-anchor="middle" font-size="13" fill="#94a3b8">顺序图 = 每步一个节点；并行图 = 每步多个节点 + 屏障同步；循环图 = 步数由路由动态决定</text>
  <rect x="330" y="686" width="500" height="32" rx="6" fill="#020617" stroke="#f87171" stroke-width="1.2"/>
  <text x="590" y="708" text-anchor="middle" font-size="12" fill="#f87171">并行的隐含代价：同一 State 键被多节点同时写 → 随机覆盖（10 篇乱序实证）</text>

  <defs>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="arA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#a78bfa"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#34d399"/></marker>
    <marker id="arY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#fbbf24"/></marker>
    <marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
</svg>
