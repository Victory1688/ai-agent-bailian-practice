<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="960" viewBox="0 0 1180 960" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1180" height="960" fill="#0f172a"/>
  <text x="590" y="44" text-anchor="middle" font-size="25" font-weight="bold" fill="#22d3ee">char05 灵魂图：并行扇出-汇聚的执行时序（10 篇广播 + 并行图）</text>
  <text x="590" y="72" text-anchor="middle" font-size="13" fill="#94a3b8">图声明并行（A 两条出边）→ 消息总线解耦（B/C 全靠收发）→ 屏障汇聚（D 自动等全部分支）</text>

  <!-- 泳道参与者 -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="40" y="100" width="150" height="42" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
    <text x="115" y="127" fill="#e2e8f0">invoke 调用方</text>

    <rect x="235" y="100" width="150" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="310" y="127" fill="#38bdf8">AgentA 拆解</text>

    <rect x="430" y="100" width="160" height="42" rx="8" fill="#020617" stroke="#fbbf24" stroke-width="2"/>
    <text x="510" y="127" fill="#fbbf24">Hub 消息总线</text>

    <rect x="635" y="100" width="140" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="705" y="127" fill="#34d399">AgentB 并行</text>

    <rect x="820" y="100" width="140" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="890" y="127" fill="#34d399">AgentC 并行</text>

    <rect x="1005" y="100" width="140" height="42" rx="8" fill="#134e4a" stroke="#22d3ee" stroke-width="2"/>
    <text x="1075" y="127" fill="#22d3ee">AgentD 汇聚</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="115" y1="142" x2="115" y2="900"/>
    <line x1="310" y1="142" x2="310" y2="900"/>
    <line x1="510" y1="142" x2="510" y2="900"/>
    <line x1="705" y1="142" x2="705" y2="900"/>
    <line x1="890" y1="142" x2="890" y2="900"/>
    <line x1="1075" y1="142" x2="1075" y2="900"/>
  </g>

  <g font-size="13" fill="#e2e8f0">
    <!-- 1 -->
    <line x1="115" y1="180" x2="310" y2="180" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arW)"/>
    <text x="212" y="172" text-anchor="middle">invoke({"query": "科研协作任务"})</text>

    <!-- 2 broadcast -->
    <line x1="310" y1="225" x2="510" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arB)"/>
    <text x="410" y="217" text-anchor="middle" fill="#7dd3fc">broadcast(tasks, [B, C])</text>
    <text x="410" y="247" text-anchor="middle" font-size="12" fill="#94a3b8">一条广播 → 2 条投递明细（存 Hub）</text>

    <!-- 3 par 框 -->
    <rect x="620" y="275" width="530" height="270" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="885" y="300" text-anchor="middle" fill="#94a3b8" font-weight="bold">par 并行分支（同一 superstep，时间戳差 &lt; 1ms）</text>

    <!-- B 分支 -->
    <line x1="510" y1="330" x2="705" y2="330" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>
    <text x="607" y="323" text-anchor="middle" fill="#86efac" font-size="12">receive("AgentB") 收广播</text>
    <line x1="705" y1="375" x2="510" y2="375" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>
    <text x="607" y="368" text-anchor="middle" fill="#86efac" font-size="12">send(B→D, results)</text>
    <rect x="525" y="390" width="165" height="34" rx="5" fill="#020617" stroke="#f87171" stroke-width="1.2"/>
    <text x="607" y="412" text-anchor="middle" font-size="11.5" fill="#f87171">实测 B = [子任务2]</text>

    <!-- C 分支 -->
    <line x1="510" y1="445" x2="890" y2="445" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>
    <text x="700" y="438" text-anchor="middle" fill="#86efac" font-size="12">receive("AgentC") 收同一份广播</text>
    <line x1="890" y1="490" x2="510" y2="490" stroke="#34d399" stroke-width="2" marker-end="url(#arG)"/>
    <text x="700" y="483" text-anchor="middle" fill="#86efac" font-size="12">send(C→D, results)</text>
    <rect x="805" y="505" width="230" height="34" rx="5" fill="#020617" stroke="#f87171" stroke-width="1.2"/>
    <text x="920" y="527" text-anchor="middle" font-size="11.5" fill="#f87171">实测 C = [子任务1, 2]（抢了 B 的活）</text>

    <!-- 屏障注记 -->
    <rect x="990" y="565" width="170" height="66" rx="6" fill="#020617" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="1075" y="590" text-anchor="middle" font-size="12" fill="#7dd3fc" font-weight="bold">屏障语义</text>
    <text x="1075" y="612" text-anchor="middle" font-size="11" fill="#a5f3fc">D 等全部入边完成</text>

    <!-- 4 D 收两条 -->
    <line x1="510" y1="580" x2="985" y2="580" stroke="#22d3ee" stroke-width="2" marker-end="url(#arC)"/>
    <text x="748" y="573" text-anchor="middle" fill="#7dd3fc">receive("AgentD") 两条汇报（时间戳差 &lt; 1ms）</text>

    <!-- 5 D self -->
    <rect x="920" y="650" width="235" height="66" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="1037" y="674" text-anchor="middle" fill="#a5f3fc">extend 拼接 + " | ".join</text>
    <text x="1037" y="696" text-anchor="middle" font-size="11.5" fill="#f87171">教材造假点：AgentD_results 键不存在</text>

    <!-- 6 返回 -->
    <line x1="1075" y1="745" x2="115" y2="745" stroke="#22d3ee" stroke-width="2" marker-end="url(#arC)"/>
    <text x="595" y="737" text-anchor="middle" fill="#7dd3fc">State.AgentD_conclusion（字符串）返回调用方</text>

    <!-- 7 教训框 -->
    <rect x="235" y="785" width="710" height="90" rx="10" fill="#020617" stroke="#b45309" stroke-width="2"/>
    <text x="590" y="813" text-anchor="middle" font-size="14" font-weight="bold" fill="#fbbf24">本图三层思想 = char05 的浓缩</text>
    <text x="590" y="838" text-anchor="middle" font-size="12.5" fill="#e2e8f0">图声明并行（A 两条出边即扇出，零线程代码） | 消息总线解耦（B/C 不共享变量，全靠收发）</text>
    <text x="590" y="861" text-anchor="middle" font-size="12.5" fill="#e2e8f0">屏障汇聚（D 的 superstep 自动等 B/C——生产级并行图的最小模型）</text>
  </g>

  <!-- 底部：随机分工警示 -->
  <rect x="40" y="890" width="1105" height="52" rx="8" fill="#020617" stroke="#b45309" stroke-width="1.5"/>
  <text x="590" y="922" text-anchor="middle" font-size="13" fill="#fde68a">广播拓扑天然随机分工（任务重复执行 + 遗漏并存）——生产需补确定性调度 / 幂等 / 超时重派（char05 汇总结论）</text>

  <defs>
    <marker id="arW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#e2e8f0"/></marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#34d399"/></marker>
    <marker id="arC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#22d3ee"/></marker>
  </defs>
</svg>
